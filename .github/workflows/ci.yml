name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run self-tests
        working-directory: mac
        run: swift run QuotaBlocks --self-test
      - name: Build app bundle
        working-directory: mac
        run: ./scripts/build-app.sh
      - name: Verify bundle
        working-directory: mac
        run: |
          plutil -lint "dist/Quota Blocks.app/Contents/Info.plist"
          codesign --verify --deep --strict "dist/Quota Blocks.app"

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build windows/QuotaBlocksWin.csproj -c Release --nologo -warnaserror
